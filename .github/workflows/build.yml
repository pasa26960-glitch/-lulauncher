name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v2
        id: buildozer
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ steps.buildozer.outputs.filename }}
